<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Monitor / dashboard mockup -->
  <rect x="120" y="120" width="560" height="340" rx="14" fill="#0B1120" stroke="#334155" stroke-width="2"/>
  <rect x="120" y="120" width="560" height="36" rx="14" fill="#111827"/>
  <circle cx="146" cy="138" r="5" fill="#EF4444"/>
  <circle cx="164" cy="138" r="5" fill="#F59E0B"/>
  <circle cx="182" cy="138" r="5" fill="#22C55E"/>

  <!-- chart bars -->
  <g>
    <rect x="150" y="330" width="34" height="100" rx="4" fill="url(#card)"/>
    <rect x="196" y="290" width="34" height="140" rx="4" fill="url(#card)" opacity="0.85"/>
    <rect x="242" y="250" width="34" height="180" rx="4" fill="url(#card)" opacity="0.7"/>
    <rect x="288" y="310" width="34" height="120" rx="4" fill="url(#card)" opacity="0.85"/>
    <rect x="334" y="270" width="34" height="160" rx="4" fill="url(#card)"/>
  </g>

  <!-- line chart -->
  <polyline points="420,300 460,260 500,280 540,220 580,240 620,190" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#60A5FA">
    <circle cx="420" cy="300" r="4"/>
    <circle cx="460" cy="260" r="4"/>
    <circle cx="500" cy="280" r="4"/>
    <circle cx="540" cy="220" r="4"/>
    <circle cx="580" cy="240" r="4"/>
    <circle cx="620" cy="190" r="4"/>
  </g>

  <!-- text lines -->
  <rect x="150" y="185" width="180" height="10" rx="5" fill="#334155"/>
  <rect x="150" y="205" width="120" height="8" rx="4" fill="#1E293B"/>

  <!-- floating card -->
  <rect x="470" y="380" width="170" height="70" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="490" y="398" width="90" height="8" rx="4" fill="#475569"/>
  <rect x="490" y="416" width="60" height="14" rx="4" fill="#60A5FA"/>
</svg>
